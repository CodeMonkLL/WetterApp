services:
  # 1. PostgreSQL Datenbank
  db:
    image: postgres:16-alpine
    container_name: wetterapp_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Flask Backend
  backend:
    build:
      context: ./WetterApp-Backend
      dockerfile: Dockerfile
    container_name: wetterapp_backend
    restart: always
    ports:
      - "${PORT}:${PORT}"
    env_file:
      - .env
    environment:
      - PORT
      - FLASK_ENV
      - SECRET_KEY
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:5432/${DB_NAME}
    depends_on:
      db:
        condition: service_healthy

  # 3. Frontend
  frontend:
    build:
      context: ./WetterApp-Frontend
      dockerfile: Dockerfile
    container_name: wetterapp_frontend
    restart: always
    ports:
      - "4200:4200"
    environment:
      - NODE_ENV=development
      - API_URL=http://backend:5000
    depends_on:
      - backend

volumes:
  postgres_data:
